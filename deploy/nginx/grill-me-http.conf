# Grill Me http-context config: the access-log format (no IP, no user agent, no referrer, no
# query string) and the content-negotiation rule for GET /. Installed as
# /etc/nginx/conf.d/grill-me-http.conf (the http context includes conf.d/*.conf).
log_format grillme_noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

# $grillme_markdown is 1 when GET / wants the install guide instead of the homepage — the same
# rule as wantsMarkdown() in packages/server/src/install.js: text/markdown in Accept, or Accept
# missing/without text/html, or a curl/Wget user agent. First match wins, so text/markdown beats
# text/html. The input is "$http_accept|$http_user_agent"; Accept never contains a |.
map "$http_accept|$http_user_agent" $grillme_markdown {
    default                 0;
    ~*^[^|]*text/markdown   1;
    ~^[^|]*\|curl/          1;
    ~^[^|]*\|Wget/          1;
    ~*^[^|]*text/html       0;
    ~*^[^|]*\|              1;
}

# Grill Me locations for the existing grill-me.ai 443 server block.
# Installed as /etc/nginx/snippets/grill-me.ai-locations.conf and included from the site file
# (deploy.sh adds the include by pattern). nginx adds no security headers on the proxied
# locations: Node sets its own. The static locations set the same ones Node does.

client_max_body_size 32k; # just above the 20 KB ciphertext limit, base64url inside JSON (~27.4 KB)

location /api/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_read_timeout 75s; # above the 50 s long poll
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /g/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_read_timeout 75s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# /healthz (public uptime probe), /go/hub (the counted hub redirect) and /stats (private) are
# served by Node, not from the static tree.
location = /healthz {
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /go/hub {
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /stats {
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Everything else comes from the static tree. A location's own add_header cancels the inherited
# ones, so the security headers are set inside each static location (same values as Node's).

# Content negotiation on /: the install guide or the homepage, by $grillme_markdown (the map in
# conf.d/grill-me-http.conf — the same rule as the Node server's wantsMarkdown). `if` only
# rewrites here, which is the safe use of `if`.
location = / {
    if ($grillme_markdown = 1) { rewrite ^ /grill-me-install last; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files /index.html =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Vary "Accept, User-Agent" always;
}

# The markdown variant of / (internal target of the rewrite above): the raw guide, like /install.
location = /grill-me-install {
    internal;
    add_header Strict-Transport-Security "max-age=31536000" always;
    types { } # no mime.types here: default_type always wins, whatever the box's .md entry says
    default_type text/plain;
    charset utf-8;
    try_files /install.md =404;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Vary "Accept, User-Agent" always;
}

# The install guide for AI agents: the raw site/install.md.
location = /install {
    add_header Strict-Transport-Security "max-age=31536000" always;
    types { } # no mime.types here: default_type always wins, whatever the box's .md entry says
    default_type text/plain;
    charset utf-8;
    try_files /install.md =404;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300" always;
}

location = /llms.txt {
    add_header Strict-Transport-Security "max-age=31536000" always;
    types { } # no mime.types here: default_type always wins, whatever the box's .md entry says
    default_type text/plain;
    charset utf-8;
    try_files /llms.txt =404;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300" always;
}

location = /demo {
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files /grill.html =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300" always;
}

location / {
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri.html $uri/ =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300" always;
}

access_log /var/log/nginx/grill-me.ai.access.log grillme_noip;

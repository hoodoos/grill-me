# Grill Me locations for the existing grill-me.ai 443 server block.
# Installed as /etc/nginx/snippets/grill-me.ai-locations.conf and included from the site file
# (deploy.sh adds the include by pattern). nginx adds no security headers on the proxied
# locations: Node sets its own. The static locations set the same ones Node does.

client_max_body_size 32k; # just above the 20 KB ciphertext limit, base64url inside JSON (~27.4 KB)

location /api/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_read_timeout 75s; # above the 50 s long poll
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /g/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_read_timeout 75s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Everything else comes from the static tree. A location's own add_header cancels the inherited
# ones, so the security headers are set inside each static location (same values as Node's).
location = /demo {
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files /grill.html =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300" always;
}

location / {
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri.html $uri/ =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300" always;
}

access_log /var/log/nginx/grill-me.ai.access.log grillme_noip;
